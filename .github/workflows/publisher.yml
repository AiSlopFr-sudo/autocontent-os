name: AutoContent OS Daily Publisher

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai requests imageio-ffmpeg python-dotenv edge-tts

      - name: Run Video Generator
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python autocontent.py

      - name: Commit and push updated history and output files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.io"
          git add history.json video_*.mp4 video_*.json 2>/dev/null || true
          git commit -m "Auto: Generated new unique video and updated history [skip ci]" || echo "No changes to commit"
          git push
